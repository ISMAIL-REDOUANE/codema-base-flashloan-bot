# --- Watchlist de paires à surveiller (VIDE pour l'instant) ---
# Le mainnet n'a AUCUN token à 2 venues en ce moment (scan 2026-11-24 :
# 0 candidat sur 80 pools), et aucune adresse de token test Amoy
# (WMATIC / USDC de test) n'a été vérifiée depuis une source officielle —
# on ne devine AUCUNE adresse. Pour ajouter une paire plus tard :
# vérifier l'adresse du token sur docs.polygon.technology ou le faucet,
# puis ajouter une entrée {token_a, token_b, label} ici.
# Le détecteur pollera alors getPair/getPool sur chaque venue "present".
watchlist: []

# --- Fichiers de sortie (relatifs à ce dossier) ---
files:
  opportunities_log: "amoy_opportunities.jsonl"   # 1 ligne JSON par opportunité simulée >= 3 $
  daily_summary: "daily_summary.json"             # compteurs par jour (spreads < 3 $ = compteurs seulement)
  detector_log: "amoy_detector.log"               # journal texte des cycles
