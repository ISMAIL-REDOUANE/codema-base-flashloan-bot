# --- PROTECTION REVERT v4.2 (2026-11-24, voir REVERT_PROTECTION_POLYGON.md) ---
# VERDICT VÉRIFIÉ : AUCUN service ne donne 0 $ sur un revert ON-CHAIN
# sur Polygon aujourd'hui. MEV Blocker /noreverts + Flashbots Protect =
# Ethereum seulement. FastLane Atlas : « No Free Reverts ». Polygon
# Private Mempool = anti-frontrunning seulement, endpoint non publié.
# Ce module NE PRÉTEND PAS au 0 $ revert : il re-simule au dernier
# bloc avant envoi et DROP avant broadcast (0 $) tout ce qui revert,
# est trop vieux (> 30 s) ou a un net <= 0 $. Le résidu (course entre
# la re-sim et l'inclusion) coûte 0,0024 $ mesuré / 0,0095 $ prudent
# par revert ; E[revert] ≈ 0,0005 $/trade tenté à 5 % de courses.
revert_protection:
  route: "public"              # "public" (défaut) ou "private"
  private_endpoint: null       # endpoint Polygon Private Mempool : NON PUBLIÉ,
                               # NON VÉRIFIÉ pour le revert — laisser null.
  private_timeout_seconds: 3.0
  max_quote_age_seconds: 30    # quote plus vieille -> DROP (0 $)
  allow_public_fallback: false # false = FAIL-CLOSED : route privée down ->
                               # NE PAS ENVOYER. true = repli public autorisé
                               # seulement si le net couvre le budget revert.
  revert_budget_usd: 0.0095    # coût prudent d'un revert (450 000 × 279 gwei)
  log_file: "revert_protection_log.jsonl"
