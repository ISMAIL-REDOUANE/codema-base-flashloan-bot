# amoy_config.yaml — Paper-trade Polygon Amoy (chaîne 80002, testnet)
# Détecteur LECTURE SEULE : aucun broadcast, aucun wallet, aucune clé
# privée, aucun fonds réel. Simulation seulement.
#
# ⚠️ ÉTAT VÉRIFIÉ LE 2026-11-24 (voir README.md § "Vérification des venues") :
# AUCUNE venue DEX du bot (Uniswap V3/V4, QuickSwap V2/V3, Sushi V2,
# Pancake V3) n'est déployée sur Amoy — eth_getCode vide pour les 13
# adresses canoniques testées, et la liste officielle Uniswap (41 réseaux)
# ne contient PAS Amoy. Le détecteur tournera donc avec 0 pool tant
# qu'aucun DEX ne se déploie sur Amoy. C'est le résultat honnête, pas un bug.

chain:
  chain_id: 80002
  name: "Polygon Amoy"
  # RPC officiel — INJOIGNABLE depuis ce sandbox le 2026-11-24
  # (HTTP 000, 2 tentatives, 22:26 UTC). Gardé en tête de liste car
  # c'est l'URL officielle ; le détecteur bascule sur les fallbacks.
  rpc_url: "https://rpc-amoy.polygon.technology"
  rpc_fallbacks:
    - "https://polygon-amoy.drpc.org"            # ✅ répond, chainId 0x13882, bloc 53 736 523 (2026-11-24)
    - "https://polygon-amoy-bor-rpc.publicnode.com"  # ✅ répond, chainId 0x13882
    # Ankr : exige une clé API — exclu (aucune clé dans ce projet).
  explorer: "https://amoy.polygonscan.com"
  block_time_seconds: 2

# Token de gas : POL de test (le réseau affiche encore "MATIC" dans les
# anciennes configs, mais Polygon a migré MATIC → POL en sept. 2024 ;
# le faucet Amoy distribue du POL). Valeur $ = 0 par définition —
# le détecteur exprime le gas en POL de test, et donne un équivalent
# "USD simulé" en valorisant le POL au prix MATIC mainnet (référence
# seulement, étiqueté comme tel dans les logs).
gas_token: "POL (test)"
matic_price_usd_reference: 0.0758   # prix MATIC mainnet 2026-11-24 — RÉFÉRENCE SEULEMENT
gas_units_per_trade: 450000
gas_price_max_gwei: 1000.0         # au-dessus : aucun trade simulé EXECUTE

# --- Règles du bot (copiées de polygon_config.yaml, SAUF le seuil de log) ---
# CHANGEMENT DE RÈGLE 2026-11-24 (Ismail) : le min profit de 3 $ est
# ABANDONNÉ comme seuil de journalisation sur Polygon. Le détecteur
# logue TOUTE opportunité simulée dont le net est > 0 $ APRÈS TOUS LES
# COÛTS : brut − flash fee (0 %) − frais de swap − gas − budget revert
# (1 × gas, pire cas trade + revert). La RÈGLE D'ARRÊT reste évaluée
# sur les opps ≥ 3 $ (les significatives) : < 1 opp ≥ 3 $/semaine → STOP.
math:
  flash_fee_rate: 0.0              # Morpho 0 % (provider Polygon)
  max_loan_usd: 50000.0
  max_pct_liquidity: 0.10          # jamais plus de 10 % de la plus petite réserve
  log_threshold_usd: 0.0           # logue tout net > 0 $ après tous les coûts (nouvelle règle 2026-11-24)
  revert_budget_gas_multiple: 1.0  # budget revert = 1 × gas (coût pire cas = 2 × gas)
  stop_rule_min_profit_usd: 3.0    # RÈGLE D'ARRÊT : comptée sur les opps ≥ 3 $ seulement
  stop_rule_min_opps_per_week: 1   # < 1 opp ≥ 3 $/semaine → STOP, ne pas financer le mainnet
  # (gas_units_per_trade et gas_price_max_gwei sont au niveau racine
  # de ce fichier — c'est là que le détecteur les lit.)

scanner:
  min_liquidity_usd: 5000.0
  max_liquidity_usd: 100000.0
  min_holders: 20
  max_age_hours: 72
  min_spread_pct: 3.0
  require_liquidity_locked: true

# Intervalle de scan : 60 s.
# Justification : le papier-trade mesure la FRÉQUENCE des opportunités
# sur 2–4 semaines (métrique hebdomadaire), pas la latence d'exécution
# (hors périmètre : aucune exécution ici). Amoy fait un bloc toutes les
# ~2 s ; 60 s = 30 blocs par cycle, largement assez pour une métrique
# de fréquence, et ça respecte les limites des RPC publics gratuits
# (drpc / publicnode). Un polling à 2–5 s n'ajouterait rien sur un
# testnet sans DEX, et risquerait le rate-limit.
scan_interval_seconds: 60

# --- Venues DEX sur Amoy : TOUTES ABSENTES (vérifié 2026-11-24) ---
